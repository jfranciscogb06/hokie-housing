/* ---------------------------- PERSISTENCE ----------------------------
   Small localStorage-backed useState so saved places, chats, posts, and
   admin decisions survive a page reload. Best-effort: falls back to plain
   in-memory state if storage is unavailable (private browsing, file:// quirks, etc). */
function usePersistentState(key, initialValue) {
    const storageKey = "hokie:" + key;
    const [state, setState] = useState(() => {
        try {
            const raw = window.localStorage.getItem(storageKey);
            return raw !== null ? JSON.parse(raw) : initialValue;
        }
        catch (e) {
            return initialValue;
        }
    });
    useEffect(() => {
        try {
            window.localStorage.setItem(storageKey, JSON.stringify(state));
        }
        catch (e) { /* storage unavailable — carry on in-memory */ }
    }, [storageKey, state]);
    return [state, setState];
}
