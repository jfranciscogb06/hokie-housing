# Render Blueprint: New > Blueprint, pick this repo. One Node web service.
services:
  - type: web
    name: hokie-housing
    runtime: node
    plan: starter            # a persistent disk needs a paid plan; for free, remove both disk and DATA_DIR (runtime changes are then ephemeral)
    buildCommand: "true"     # no dependencies or build step
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard; optional (built-in search works without it)
      - key: OPENAI_SEARCH_MODEL
        value: gpt-4o-mini
      - key: TRUST_PROXY_HOPS
        value: "0"           # ignore forwarded headers until the actual proxy chain is verified
    disk:
      name: hokie-data
      mountPath: /var/data
      sizeGB: 1
